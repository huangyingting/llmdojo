services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: llmdojo
      POSTGRES_PASSWORD: llmdojo_prod_password
      POSTGRES_DB: llmdojo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: "postgresql://llmdojo:llmdojo_prod_password@postgres:5432/llmdojo?schema=public"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "replace-with-production-32-byte-secret"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
